<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TITLE IN LOWER CASE</title>
<style>
  /* Palette: dark by default, light when the OS asks. Every colour in the page,
     SVG included, comes from these variables, so both themes work for free. */
  :root {
    --bg: #191919;
    --text: #e6e6e6;
    --muted: #9b9b9b;
    --line: #2c2c2c;
    --code: #202020;
    --box: #202020;
    --edge: #4d4d4d;
    --accent: #6f9ad3;
    --accent-bg: #1b2431;
    --warm: #d9a441;
    --warm-bg: #2b2418;
    --good: #6fbf73;
    --bad: #e07a6f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbfbfa;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --line: #e6e6e3;
      --code: #f2f2f0;
      --box: #ffffff;
      --edge: #b9b9b5;
      --accent: #2f6bbd;
      --accent-bg: #e8f0fb;
      --warm: #a8700f;
      --warm-bg: #fbf1de;
      --good: #2e8b3a;
      --bad: #c0392b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 900px;
    padding: 3rem 1.25rem 6rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 1.6rem; font-weight: 650; letter-spacing: -0.03em; margin: 0 0 0.4rem; }
  h2 { font-size: 1.05rem; margin: 2.8rem 0 0.6rem; scroll-margin-top: 1rem; }
  h3 { font-size: 0.95rem; margin: 1.6rem 0 0.4rem; }
  p, li { max-width: 68ch; }
  .lede { color: var(--muted); margin: 0 0 1rem; }
  .meta { color: var(--muted); font-size: 0.85rem; margin: 0 0 2rem; }
  a { color: inherit; }
  ul, ol { padding-left: 1.2rem; }
  li { margin: 0.35rem 0; }
  strong { font-weight: 620; }

  nav { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0.6rem 0; margin-bottom: 1rem; font-size: 0.88rem; }
  nav a { color: var(--muted); text-decoration: none; margin-right: 1rem; white-space: nowrap; }
  nav a:hover { color: var(--text); }

  pre, code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 0.86em; }
  pre { background: var(--code); border: 1px solid var(--line); padding: 0.9rem 1rem; overflow-x: auto; }
  code { background: var(--code); padding: 0.1em 0.35em; }
  pre code { background: none; padding: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; margin: 0.6rem 0 1rem; }
  th, td { text-align: left; vertical-align: top; padding: 0.45rem 0.8rem 0.45rem 0; border-top: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 550; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* Stat row: 2–4 headline numbers, each with a label under it. */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 1rem 0 1.5rem; }
  .stat { background: var(--bg); padding: 0.8rem 1rem; }
  .stat b { display: block; font-size: 1.35rem; font-weight: 620; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 0.82rem; }

  /* Callout: one short paragraph that must not be missed. */
  .note, .warn { border-left: 2px solid var(--accent); background: var(--accent-bg); padding: 0.7rem 1rem; margin: 1rem 0; max-width: 68ch; }
  .warn { border-color: var(--warm); background: var(--warm-bg); }
  .note p, .warn p { margin: 0; }

  .tag { display: inline-block; font-size: 0.75rem; padding: 0.05rem 0.45rem; border: 1px solid var(--edge); color: var(--muted); border-radius: 999px; }
  .good { color: var(--good); } .bad { color: var(--bad); }

  .todo { list-style: none; padding-left: 0; }
  .todo li::before { content: "○"; color: var(--muted); margin-right: 0.6rem; }
  .todo li.done::before { content: "●"; color: var(--good); }

  details { border-top: 1px solid var(--line); padding: 0.5rem 0; }
  summary { cursor: pointer; color: var(--muted); }

  figure { margin: 1.6rem 0 1.2rem; overflow-x: auto; }
  figure svg { display: block; width: 100%; min-width: 600px; height: auto; }
  figcaption { color: var(--muted); font-size: 0.85rem; margin-top: 0.6rem; max-width: 68ch; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 13px; fill: var(--text); }
  svg .t { font-size: 15px; font-weight: 600; }
  svg .n { font-weight: 600; }
  svg .q { font-size: 11.5px; fill: var(--muted); }
  svg .mid { text-anchor: middle; }
  svg .end { text-anchor: end; }
  svg .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.25; }
  svg .hot { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2; }
  svg .warmbox { fill: var(--warm-bg); stroke: var(--warm); stroke-width: 1.5; }
  svg .wire { fill: none; stroke: var(--edge); stroke-width: 1.25; }
  svg .loop { fill: none; stroke: var(--accent); stroke-width: 2; }
  svg .dash { stroke-dasharray: 4 4; }
  svg .arrowhead { fill: var(--edge); }
  svg .arrowhead.hot { fill: var(--accent); stroke: none; }
  svg .bar { fill: var(--accent); }
  svg .grid { stroke: var(--line); }
</style>
</head>
<body>

<p class="lede">The answer in two or three sentences: what this is, the result, and the one number or decision that matters.</p>
<p class="meta">9 November 2026 · scope or audience in a few words</p>
